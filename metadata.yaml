name: astrbot_plugin_bsk_browser
display_name: 我会用浏览器
short_desc: 让机器人操控你已登录的真实浏览器 —— 打开网页、点击、填表、截图。
desc: |
  把本机的 bsk 命令行工具包装成机器人可以直接调用的工具，让机器人操作你**真实已登录**的浏览器：
  打开网页、读取页面内容、点击按钮、填写表单、截图。因为复用的是你日常在用的那个浏览器，
  所以需要登录才能看的页面（后台、邮箱、内部系统）它也能读，不必再单独登录一次 —— 这是它与
  "另开一个无头浏览器"类插件的关键区别。

  【工具】6 个工具共 33 个动作：bsk_session 管理机器人自己的浏览器会话（打开 / 关闭 / 列出）；
  bsk_page 负责导航、前进后退、刷新与等待页面加载；bsk_inspect 读取页面内容与可交互元素、
  截图、查看控制台消息与网络请求；bsk_interact 做点击、悬停、滚动、聚焦、输入、下拉选择、
  按键等 9 种交互；bsk_tabs 管理标签页 —— 列出、新建、切换、关闭，还能把你已经打开的那个
  标签页"借用"给机器人操作，用完归还；bsk_assist 按手机 / 平板等内置设备规格模拟显示、
  缩放窗口，以及让机器人在页面上直接向你求助（例如需要你手动扫码或输入验证码时）。
  bsk_inspect 另带网络调试：开始与结束抓包、查看和导出请求详情、重新发送请求，以及添加
  规则去拦截、改写或伪造某个请求的返回。旧版 8 个工具默认继续保留，也可以在配置里一键
  关闭，省下每轮对话都要带上的工具描述开销。

  【前置条件】使用前必须自己准备好这三样，插件不会替你安装：
  1. 已安装 bsk 命令行工具（本插件不附带、不捆绑它的任何二进制文件）；
  2. 浏览器里已装好并启用了配套扩展，且扩展显示为已连接；
  3. 在插件配置里填写 bsk 的实际路径（留空则从 PATH 查找）。
  在终端执行 `bsk doctor` 可以自检环境；执行 `bsk browsers --json` 可以看到已连接的浏览器。

  【安全提醒】这些工具会操作用户已登录的浏览器，因此默认**只允许 AstrBot 管理员**调用。
  请不要随意关闭该限制：一旦关闭，任何能给机器人发消息的人都能翻看和操作你的浏览器内容。

  【非官方声明】本插件是腾讯 BrowserSkill / bsk 的**第三方非官方集成**，由社区开发者独立编写和维护，
  与腾讯公司及其关联方**没有任何隶属、合作或背书关系**。"腾讯"、"BrowserSkill" 等名称与商标归其各自
  权利人所有，本项目仅在描述兼容性时以指称方式提及。本项目不包含、不分发 bsk 及其扩展的任何代码或二进制。
  使用本插件仍需遵守 bsk 自身的许可条款。

